<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!--
      LCP image preload — tells the browser to fetch the hero profile image
      immediately, before it parses React JS and discovers the <img> tag.
      imagesrcset + imagesizes mirrors the responsive sizes in Hero.tsx so
      mobile devices get the right resolution (saves ~30KB on phones).
    -->
    <link
      rel="preload"
      as="image"
      href="/images/profile.webp"
      type="image/webp"
      imagesrcset="/images/profile.webp"
      imagesizes="(max-width: 639px) 192px, (max-width: 1023px) 256px, (max-width: 1279px) 320px, 384px"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mohammed Khudair - Frontend Developer & AI Automation Specialist. React, JavaScript, N8n workflows, and modern web technologies."
    />
    <meta
      name="keywords"
      content="Mohammed Khudair, React Developer, Frontend Developer, AI Automation, N8n, JavaScript, Tailwind CSS, Web Development, UI/UX"
    />
    <meta name="author" content="Mohammed Khudair" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohammed Khudair - Frontend Developer & AI Automation Specialist" />
    <meta
      property="og:description"
      content="Frontend Developer & AI Automation Specialist, working with React, N8n Automation, and AI-powered interfaces."
    />
    <meta property="og:url" content="https://persona-website-mlux.vercel.app/" />
    <meta property="og:site_name" content="Mohammed Khudair" />
    <meta property="og:image" content="https://persona-website-mlux.vercel.app/images/profile.jpg" />
    <meta property="og:image:width" content="1183" />
    <meta property="og:image:height" content="1329" />
    <meta property="og:image:alt" content="Mohammed Khudair" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohammed Khudair - Frontend Developer &amp; AI Automation Specialist" />
    <meta
      name="twitter:description"
      content="Frontend Developer &amp; AI Automation Specialist, working with React, N8n Automation, and AI-powered interfaces."
    />
    <meta name="twitter:image" content="https://persona-website-mlux.vercel.app/images/profile.jpg" />
    <link rel="canonical" href="https://persona-website-mlux.vercel.app/" />

    <title>Mohammed Khudair - Frontend Developer | React Specialist</title>

    <!--
      Applies the stored theme and language/direction before first paint.
      External + same-origin so the CSP can stay on script-src 'self'.
      Must stay render-blocking (no defer/module) to prevent a flash.
    -->
    <script src="/bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
